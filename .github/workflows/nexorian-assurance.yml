name: Nexorian Continuous Assurance
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust format, lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile all targets
        run: cargo check --all-targets --all-features
      - name: Run unit and mock-server tests
        run: cargo test --all-targets --all-features

  ollama-inference:
    name: Llama 3.2 live inference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Wait for Ollama and pull Llama 3.2
        env:
          OLLAMA_CONTAINER_ID: ${{ job.services.ollama.id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          docker exec "$OLLAMA_CONTAINER_ID" ollama pull llama3.2
      - name: Verify real Llama 3.2 inference
        env:
          OLLAMA_MODEL: llama3.2
          OLLAMA_ENDPOINT: http://127.0.0.1:11434/api/generate
        run: cargo run --example ollama_smoke --features std
